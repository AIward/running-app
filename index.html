<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1113">
<title>제주 아트런</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@1,800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page-bg:#e4e2dc;
  --bg:#0e1113; --card:#171b1e; --card2:#202729; --line:#2c3337; --track:#262c30;
  --fg:#edeff0; --fg2:#c9cfd2; --muted:#9aa4a8; --dim:#7d878b;
  --teal:#3fd0c0; --teal-ink:#06201d; --teal-bg:#12302c; --orange:#ff9f43; --blue:#2f80ff;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page-bg:#0a0c0d}}
:root[data-theme="dark"]{--page-bg:#0a0c0d}
@media (max-width:520px){:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--page-bg:#0e1113}}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;background:var(--page-bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--page-bg);color:var(--fg);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.stage{height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}

/* ---------- device frame (desktop) ---------- */
.device{position:relative;width:414px;height:866px;padding:12px;border-radius:62px;background:#2b2e31;
  border:2px solid #4a4e52;flex-shrink:0;transform:scale(var(--s,1));transform-origin:center center}
.device>i{position:absolute;width:4px;border-radius:2px;background:#3a3e42}
.device>i.a{left:-5px;top:170px;height:36px}.device>i.b{left:-5px;top:222px;height:64px}
.device>i.c{left:-5px;top:298px;height:64px}.device>i.d{right:-5px;top:250px;height:96px}
.phone{position:relative;width:100%;height:100%;border-radius:50px;overflow:hidden;background:var(--bg);color:var(--fg);
  display:flex;flex-direction:column;isolation:isolate}
.island{position:absolute;top:14px;left:50%;margin-left:-12px;width:24px;height:24px;border-radius:12px;background:#000;
  border:2px solid #1a1d20;z-index:50}
.sbar{height:50px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0;font-size:14px;font-weight:600}
.sbar span:last-child{display:flex;gap:6px;align-items:center}
.homebar{position:absolute;bottom:8px;left:50%;margin-left:-67px;width:134px;height:5px;border-radius:3px;background:#edeff0;z-index:40;pointer-events:none}
#view{flex:1;min-height:0;display:flex;flex-direction:column}

@media (max-width:520px){
  .device{width:100%;height:100%;padding:0;border:0;border-radius:0;background:none;transform:none}
  .device>i,.island,.sbar,.homebar{display:none}
  .phone{border-radius:0}
}

/* ---------- shared ---------- */
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:4px 20px 6px;flex-shrink:0}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;padding:8px 8px 8px 0;cursor:pointer;border-radius:12px}
.logo span{font-size:17px;font-weight:700;letter-spacing:-.01em}
.iconbtn{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;padding:0;cursor:pointer;position:relative;border-radius:22px}
.iconbtn:active,.logo:active{background:#ffffff10}
.bell .dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:#ff5d5d;border:2px solid var(--bg)}
button:focus-visible,[role=button]:focus-visible,a:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

.tabs{margin:4px 20px 0;padding:4px;border-radius:14px;background:#1a1f22;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;flex-shrink:0}
.tabs button{height:44px;border:0;border-radius:11px;font-size:15px;font-weight:500;background:transparent;color:var(--muted);cursor:pointer;transition:background .2s,color .2s}
.tabs button.on{background:var(--teal);color:var(--teal-ink);font-weight:700}
.region{padding:20px 20px 14px;display:flex;align-items:flex-end;justify-content:space-between;flex-shrink:0}
.region small{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:2px}
.region .rg{display:flex;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer}
.region .h2{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.region .meta{font-size:13px;color:var(--muted)}
.pad{padding:0 20px 44px;display:flex;flex-direction:column;gap:14px}

.vote{display:flex;gap:4px;flex-shrink:0}
.vbtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card2);display:grid;place-items:center;padding:0;cursor:pointer;
  transition:background .18s,border-color .18s,transform .12s}
.vbtn svg{width:14px;height:14px;fill:none;transition:fill .18s,stroke .18s}
.vbtn.lg{width:44px;height:44px}.vbtn.lg svg{width:20px;height:20px}
.vbtn:active{transform:scale(.9)}
.vbtn.up svg{stroke:var(--teal)}.vbtn.down svg{stroke:var(--orange)}
.vbtn.up[aria-pressed="true"]{background:var(--teal);border-color:var(--teal)}
.vbtn.up[aria-pressed="true"] svg{stroke:var(--teal-ink);fill:var(--teal-ink)}
.vbtn.down[aria-pressed="true"]{background:var(--orange);border-color:var(--orange)}
.vbtn.down[aria-pressed="true"] svg{stroke:#2a1400;fill:#2a1400}
.vbtn.pop{animation:pop .38s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.22)}100%{transform:scale(1)}}

/* ---------- home ---------- */
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.quick button{border:0;border-radius:16px;background:var(--card);padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.quick button:active{background:#1e2428}
.quick .qi{width:36px;height:36px;border-radius:12px;background:var(--card2);display:grid;place-items:center}
.quick b{font-size:13px;font-weight:700}
.quick small{font-size:11px;color:var(--muted);margin-top:-4px}
.card{padding:12px 14px;border-radius:16px;background:var(--card);display:flex;flex-direction:column;gap:6px}
.card.rank{gap:8px}
.card-h{display:flex;align-items:center;justify-content:space-between;min-height:20px}
.card-h h3{margin:0;font-size:15px;font-weight:700}
.more{background:none;border:0;padding:6px 0 6px 12px;font-size:12px;color:var(--muted);cursor:pointer}
.legend{display:flex;gap:10px;font-size:11px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:8px;height:8px;border-radius:2px;display:block}
.nrow{display:flex;align-items:center;gap:10px;height:30px;width:100%;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.nrow:active .nt{color:#fff}
.nt{flex:1;min-width:0;font-size:13px;color:#d6dbdd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nd{font-size:11px;color:var(--dim);flex-shrink:0}
.newb{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:4px;background:var(--orange);color:#2a1400;font-size:9px;font-weight:800;margin-right:6px;vertical-align:1px}
.rk{display:flex;align-items:center;gap:10px;height:28px;width:100%;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.rk .n{width:20px;font-size:12px;font-weight:700;color:var(--dim);flex-shrink:0}
.rk .nm{width:104px;flex-shrink:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .bar{flex:1;height:8px;border-radius:4px;overflow:hidden;display:flex;background:var(--orange)}
.rk .bar i{display:block;background:var(--teal);transition:width .5s ease}
.rk .ct{width:76px;flex-shrink:0;display:flex;justify-content:flex-end;gap:8px;font-size:11px;color:var(--fg2)}
.rk .ct span{display:flex;align-items:center;gap:3px;border-radius:8px;padding:1px 3px;margin:-1px -3px}
.rk .ct span.mine.u{background:#3fd0c022;color:var(--teal);font-weight:700}
.rk .ct span.mine.d{background:#ff9f4322;color:var(--orange);font-weight:700}
.rk.flash{animation:flash 1.2s ease}
@keyframes flash{0%,60%{background:#ffffff12}100%{background:transparent}}
.rk{border-radius:8px}

/* ---------- course ---------- */
.mapimg{width:100%;aspect-ratio:346/163;object-fit:cover;border-radius:16px;display:block;border:1px solid var(--track)}
.crow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.crow h3{margin:0;font-size:20px;font-weight:700}
.crow p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats3>div{padding:12px;border-radius:14px;background:var(--card)}
.stats3 small{display:block;font-size:12px;color:var(--muted)}
.stats3 b{display:block;font-size:18px;font-weight:700;margin-top:4px}
.sec-t{font-size:13px;font-weight:600;color:var(--fg2);margin-bottom:8px}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mode{text-align:left;padding:12px;border-radius:14px;background:var(--card);border:1.5px solid var(--track);cursor:pointer;transition:border-color .2s,background .2s}
.mode b{display:block;font-size:15px;font-weight:700}
.mode small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.mode[aria-pressed="true"]{background:var(--teal-bg);border-color:var(--teal)}
.mode[aria-pressed="true"] small{color:#a9c9c4}
.cta{height:54px;border:0;border-radius:16px;background:var(--teal);color:var(--teal-ink);font-size:17px;font-weight:700;cursor:pointer;margin-top:4px;width:100%}
.cta:active{filter:brightness(.92)}
.cta.ghost{background:var(--card2);color:var(--fg);border:1px solid var(--line)}

/* ---------- contents ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.chips::-webkit-scrollbar{display:none}
.chip-f{height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line);background:transparent;color:var(--fg2);font-size:13px;cursor:pointer;flex-shrink:0;transition:all .2s}
.chip-f[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
.hint{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px;margin-top:-4px}
.grp{display:flex;flex-direction:column;gap:8px}
.grp>h4{margin:0;font-size:14px;font-weight:700}
.prow{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;background:var(--card);cursor:pointer;user-select:none;transition:background .15s}
.prow:active{background:#1e2428}
.pic{width:44px;height:44px;flex-shrink:0;border-radius:12px;background:var(--card2);display:grid;place-items:center}
.pm{flex:1;min-width:0}
.pn{font-size:15px;font-weight:600;word-break:keep-all}
.pt{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4;word-break:keep-all}

/* ---------- shop ---------- */
.banner{padding:16px;border-radius:16px;background:var(--teal-bg);border:1px solid #1e4a44;display:flex;align-items:center;gap:14px}
.banner b{display:block;font-size:16px;font-weight:700}
.banner small{display:block;font-size:12px;color:#a9c9c4;margin-top:2px}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pcard{border-radius:16px;background:var(--card);overflow:hidden}
.pcard .ph{height:118px;background:var(--card2)}
.pcard img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .pb{padding:10px 10px 12px 12px}
.ptag{font-size:11px;font-weight:600;color:var(--muted)}
.ptag.hl{color:var(--teal)}
.pname{font-size:14px;font-weight:600;margin-top:2px}
.pprice{font-size:14px;font-weight:700;margin-top:6px;display:flex;align-items:center;justify-content:space-between;gap:4px;white-space:nowrap}
.pprice .vote{gap:3px}

/* ---------- sub pages ---------- */
.subbar{display:flex;align-items:center;gap:4px;padding:0 12px 4px 8px;flex-shrink:0}
.subbar .st{flex:1;font-size:17px;font-weight:700}
.list{padding:4px 20px 44px;display:flex;flex-direction:column}
.lrow{display:flex;flex-direction:column;gap:6px;padding:14px 2px;border:0;border-bottom:1px solid var(--track);background:none;text-align:left;width:100%;cursor:pointer}
.lrow:active{background:#ffffff08}
.lrow .lt{font-size:15px;font-weight:600;line-height:1.4}
.lrow .lm{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;font-size:11px;font-weight:700}
.chip.notice{background:#3fd0c01f;color:var(--teal)}.chip.news{background:#ff9f431f;color:var(--orange)}
.art{padding:8px 20px 44px}
.art h1{margin:12px 0 8px;font-size:22px;line-height:1.35;letter-spacing:-.02em}
.art .meta{font-size:12px;color:var(--dim);padding-bottom:16px;border-bottom:1px solid var(--track);margin-bottom:18px}
.art p{margin:0 0 14px;font-size:15px;line-height:1.75;color:#d6dbdd;word-break:keep-all}
.art img{width:100%;border-radius:14px;display:block;margin:0 0 18px;border:1px solid var(--track)}
.note{margin:22px 0 18px;padding:12px 14px;border-radius:12px;background:var(--card);font-size:12px;color:var(--muted);line-height:1.5}

/* ---------- overlays ---------- */
#overlay{position:absolute;inset:0;z-index:60;pointer-events:none}
.sheet-wrap{position:absolute;inset:0;display:flex;align-items:flex-end;pointer-events:auto}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fade .2s ease}
.sheet{position:relative;width:100%;max-height:86%;overflow-y:auto;scrollbar-width:none;background:var(--card);border-radius:28px 28px 0 0;padding:10px 20px 34px;animation:rise .28s cubic-bezier(.2,.9,.25,1)}
.sheet::-webkit-scrollbar{display:none}
.grab{width:40px;height:4px;border-radius:2px;background:#3a4246;margin:0 auto 16px}
.sheet h3{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.sheet .sub{margin:4px 0 0;font-size:13px;color:var(--muted);line-height:1.55;word-break:keep-all}
.sheet .lead{margin:16px 0 10px;font-size:12px;color:var(--dim);word-break:keep-all}
.approw{display:flex;align-items:center;gap:14px;padding:12px;border-radius:14px;background:var(--card2);text-decoration:none;color:var(--fg);margin-bottom:8px;border:1px solid transparent}
.approw:active{border-color:var(--teal)}
.approw .ab{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:17px;flex-shrink:0}
.approw b{display:block;font-size:15px;font-weight:600}
.approw small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.approw svg{margin-left:auto;flex-shrink:0}
.sbtns{display:grid;gap:8px;margin-top:18px}
.sbtns.two{grid-template-columns:1fr 1fr}
.sbtns .cta{margin-top:0;height:50px;font-size:15px}
.cta.warn{background:var(--card2);color:var(--orange);border:1px solid #ff9f4355}
.frow{display:flex;align-items:center;gap:10px;padding:10px 0;border:0;border-bottom:1px solid var(--track);background:none;width:100%;text-align:left;cursor:pointer}
.frow:last-child{border-bottom:0}
.frow .t{flex:1;min-width:0;font-size:14px;font-weight:500;line-height:1.35}
.frow .d{font-size:11px;color:var(--dim)}
.fin-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.fin-grid>div{background:var(--card2);border-radius:14px;padding:12px}
.fin-grid small{display:block;font-size:11px;color:var(--muted)}
.fin-grid b{display:block;font-size:18px;font-weight:700;margin-top:3px}
.fin-badge{width:56px;height:56px;border-radius:50%;background:var(--teal-bg);border:1px solid #1e4a44;display:grid;place-items:center;margin-bottom:12px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.toast{position:absolute;left:16px;right:16px;bottom:38px;z-index:70;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;
  background:#252d31;border:1px solid var(--line);box-shadow:0 8px 24px #0008;font-size:13px;line-height:1.4;pointer-events:none;word-break:keep-all;animation:toastin .28s cubic-bezier(.2,.9,.25,1)}
.toast .tsub{display:block;color:var(--fg2);font-size:12px;margin-top:1px}
.toast .ti{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:var(--card2)}
.toast.out{animation:toastout .22s ease forwards}
@keyframes toastin{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes toastout{to{transform:translateY(10px);opacity:0}}

/* ---------- running ---------- */
.runhdr{display:flex;align-items:center;gap:8px;padding:2px 14px 6px;flex-shrink:0}
.runhdr .tt{flex:1;min-width:0}
.runhdr .tt small{display:block;font-size:12px;color:var(--muted)}
.runhdr .tt b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gps{height:30px;padding:0 12px;border-radius:15px;background:var(--card);display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;flex-shrink:0}
.gps i{width:8px;height:8px;border-radius:4px;background:#4cd964}
.rmap{position:relative;width:100%;height:290px;flex-shrink:0;overflow:hidden;background:#dde3e6}
.rmap-in{position:absolute;left:0;top:0;width:1200px;height:566px;transform-origin:0 0;will-change:transform}
.rmap-in.anim{transition:transform .55s cubic-bezier(.3,.8,.3,1)}
.rmap-in img{position:absolute;left:0;top:0;width:1200px;height:566px;max-width:none;display:block;user-select:none;-webkit-user-drag:none}
.rmap-in svg{position:absolute;left:0;top:0;width:1200px;height:566px;overflow:visible}
.mk{position:absolute;left:0;top:0;width:0;height:0}
.me .gps-ring{position:absolute;left:-12px;top:-12px;width:24px;height:24px;border-radius:12px;background:var(--blue);animation:gps 1.8s ease-out infinite}
.me .dotc{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:9px;background:var(--blue);border:3px solid #fff;box-shadow:0 1px 4px #0006}
.pmk .dotc{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:9px;background:var(--orange);border:3px solid #fff;box-shadow:0 1px 4px #0006;
  display:grid;place-items:center;font-size:8px;font-weight:800;color:#2a1400}
@keyframes gps{0%{transform:scale(.6);opacity:.55}100%{transform:scale(2.4);opacity:0}}
.rchip{position:absolute;height:30px;padding:0 12px;border-radius:15px;background:rgba(14,17,19,.85);display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--fg);border:0}
.rchip.bl{left:14px;bottom:14px}.rchip.tl{left:14px;top:12px;font-size:11px;color:var(--muted);height:26px}
.rchip.tr{right:14px;top:12px;cursor:pointer}.rchip.br{right:14px;bottom:14px;color:var(--orange)}
.rchip .md{width:10px;height:10px;border-radius:5px;background:var(--blue);border:2px solid #fff}
.rstats{padding:16px 24px 0;flex-shrink:0}
.bigrow{display:flex;align-items:flex-end;justify-content:space-between}
.bignum{font-family:Barlow,"IBM Plex Sans KR",sans-serif;font-style:italic;font-weight:800;font-size:84px;line-height:.9;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.unit{font-size:14px;color:var(--muted);margin-top:8px}
.nextcp{text-align:right;padding-bottom:4px}
.nextcp small{font-size:12px;color:var(--muted)}
.nextcp b{display:block;font-size:20px;font-weight:700;color:var(--teal);margin-top:2px}
.prog{height:6px;border-radius:3px;background:var(--track);margin-top:14px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--teal)}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 8px;margin-top:18px}
.mgrid b{display:flex;align-items:center;gap:4px;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.mgrid small{display:block;font-size:12px;color:var(--muted)}
.rctrl{margin-top:auto;padding:0 24px 34px;display:flex;align-items:center;justify-content:center;gap:28px;flex-shrink:0}
.rb{border-radius:50%;display:grid;place-items:center;padding:0;cursor:pointer;transition:opacity .2s,transform .12s}
.rb:active{transform:scale(.93)}
.rb.s{width:60px;height:60px;border:1.5px solid #3a4246;background:var(--card)}
.rb.m{width:84px;height:84px;border:0;background:var(--teal)}
.rb:disabled{opacity:.3;cursor:not-allowed}
.rb.on{border-color:var(--teal);background:var(--teal-bg)}
.lockhint{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:11px;color:var(--dim);pointer-events:none}

/* ---------- expanded map ---------- */
.island{z-index:58}
.mapwrap{position:relative;display:block;border-radius:16px;cursor:pointer;flex-shrink:0}
.mapwrap:active{filter:brightness(.93)}
.mapwrap .xb{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;background:rgba(14,17,19,.82);display:grid;place-items:center;color:#fff}
.mapwrap .xc{position:absolute;left:10px;bottom:10px;height:28px;padding:0 11px;border-radius:14px;background:rgba(14,17,19,.85);font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.mapfull{position:absolute;inset:0;z-index:55;overflow:hidden;--mfb:26px;--cardh:0px;transition:clip-path .52s cubic-bezier(.22,.8,.24,1)}
.mf-bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(22px) brightness(.48) saturate(.85);opacity:0;transition:opacity .45s}
.mapfull.open .mf-bg{opacity:1}
.mf-stage{position:absolute;left:0;top:0;width:1200px;height:566px;transform-origin:0 0;transition:transform .52s cubic-bezier(.22,.8,.24,1);touch-action:none;will-change:transform}
.mf-stage>img{display:block;width:1200px;height:566px;max-width:none;user-select:none;-webkit-user-drag:none;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 4%,#000 96%,transparent),linear-gradient(to right,transparent,#000 3%,#000 97%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to bottom,transparent,#000 4%,#000 96%,transparent),linear-gradient(to right,transparent,#000 3%,#000 97%,transparent);mask-composite:intersect}
.mpin{position:absolute;left:0;top:0;width:0;height:0;opacity:0;transition:transform .52s cubic-bezier(.22,.8,.24,1),opacity .3s}
.mapfull.ready .mpin{opacity:1}
.mpin.hide{opacity:0!important;pointer-events:none}
.mpin.hide *{pointer-events:none}
.mpb{position:absolute;left:-22px;bottom:0;width:44px;display:flex;flex-direction:column;align-items:center;border:0;background:none;padding:0;cursor:pointer;transform-origin:50% 100%;transition:transform .32s cubic-bezier(.3,1.5,.5,1)}
.mpi{width:44px;height:44px;border-radius:50%;border:3px solid var(--c);background:#fff;overflow:hidden;box-shadow:0 3px 10px #0008;display:block}
.mpi img{width:100%;height:100%;object-fit:cover;display:block}
.mpt{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--c);margin-top:-2px}
.mpl{position:absolute;bottom:100%;margin-bottom:6px;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(14,17,19,.92);color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none}
.mpin.sel{z-index:5}.mpin.sel .mpb{transform:scale(1.4)}.mpin.sel .mpl{opacity:1}
.mpin.hide .mpb{transform:scale(.4)}
.mpin.me{z-index:6;pointer-events:none}
.mpin.me .gps-ring{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:14px;background:var(--blue);animation:gps 1.8s ease-out infinite}
.mpin.me .dotc{position:absolute;left:-10px;top:-10px;width:20px;height:20px;border-radius:10px;background:var(--blue);border:3px solid #fff;box-shadow:0 1px 5px #0007}
.mf-ui{opacity:0;transition:opacity .3s}
.mapfull.ready .mf-ui{opacity:1}
.mf-top{position:absolute;left:14px;right:14px;top:58px;display:flex;align-items:flex-start;justify-content:space-between;z-index:6}
@media (max-width:520px){.mf-top{top:12px}}
.mfbtn{width:44px;height:44px;border-radius:50%;border:0;background:rgba(14,17,19,.9);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 12px #0007;color:#fff;padding:0}
.mfbtn:active{transform:scale(.93)}
.mfbtn.find{position:absolute;right:14px;bottom:calc(var(--cardh) + var(--mfb) + 12px);z-index:6;transition:bottom .42s cubic-bezier(.22,.8,.24,1),opacity .3s,background .2s}
.mfbtn.find.on{background:var(--blue)}
.dd{position:relative}
.ddb{height:44px;padding:0 12px 0 14px;border-radius:22px;border:0;background:rgba(14,17,19,.9);color:#fff;display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;box-shadow:0 2px 12px #0007}
.ddb b{font-weight:600}
.ddb .dot,.ddm .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.ddb .n{font-size:12px;color:var(--muted)}
.ddm{position:absolute;top:50px;left:0;min-width:190px;list-style:none;margin:0;padding:6px;border-radius:16px;background:rgba(23,27,30,.98);box-shadow:0 10px 30px #000a;animation:fade .15s;z-index:8}
.ddm button{width:100%;display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;border:0;background:none;border-radius:11px;font-size:14px;cursor:pointer;text-align:left}
.ddm button[aria-selected="true"]{background:#ffffff14;font-weight:700}
.ddm .n{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
.mf-card{position:absolute;left:12px;right:12px;bottom:var(--mfb);z-index:7;border-radius:22px;background:var(--card);box-shadow:0 10px 40px #000b;overflow:hidden;border:1px solid var(--line);transform:translateY(calc(100% + 60px));transition:transform .44s cubic-bezier(.22,.8,.24,1)}
.mf-card.show{transform:none}
.mfc-top{display:flex;gap:12px;padding:14px 50px 0 14px}
.mfc-img{position:relative;width:98px;height:98px;flex-shrink:0;border-radius:16px;overflow:hidden;background:var(--card2)}
.mfc-img img{width:100%;height:100%;object-fit:cover;display:block}
.mfc-cap{position:absolute;left:6px;bottom:6px;font-size:9px;padding:2px 7px;border-radius:8px;background:rgba(14,17,19,.72)}
.mfc-info{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center}
.mf-hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--mfb) + 6px);white-space:nowrap;padding:9px 16px;border-radius:20px;background:rgba(14,17,19,.85);font-size:12px;font-weight:500;color:#dfe5e7;pointer-events:none;z-index:4;transition:opacity .3s}
.mapfull.zoomed .mf-hint{opacity:0!important}
.mfc-x{position:absolute;right:10px;top:10px;z-index:2;width:32px;height:32px;border-radius:50%;border:0;background:rgba(14,17,19,.75);display:grid;place-items:center;cursor:pointer;padding:0}
.mfc-b{padding:10px 14px 14px}
.mfc-t{display:flex;align-items:center;gap:8px;font-size:11px}
.cchip{display:inline-flex;height:22px;align-items:center;padding:0 9px;border-radius:11px;font-weight:700}
.rkchip{color:var(--muted)}.rkchip b{color:var(--teal)}
.mfc-info h3{margin:7px 0 2px;font-size:18px;font-weight:700;letter-spacing:-.01em}
.mfc-tags{margin:0;font-size:12px;color:var(--muted);word-break:keep-all}
.mfc-desc{margin:0;font-size:13px;line-height:1.55;color:#d6dbdd;word-break:keep-all}
.mfc-row{display:flex;align-items:center;gap:10px;margin-top:12px}
.cta.sm{height:44px;font-size:14px;margin:0;flex:1;border-radius:14px}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

const $=(s,el)=>(el||document).querySelector(s);
const $$=(s,el)=>Array.from((el||document).querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n.toLocaleString('ko-KR');

/* ---- voting / ranking ---- */
function countsOf(kind,it){const v=state.votes[kind][it.id];return{up:it.up+(v==='up'?1:0),down:it.down+(v==='down'?1:0),mine:v||null};}
function ranked(kind){
  return DATA[kind].map(it=>{const c=countsOf(kind,it);return{it,up:c.up,down:c.down,mine:c.mine,ratio:c.up/(c.up+c.down)};})
    .sort((a,b)=>b.ratio-a.ratio||b.up-a.up);
}
function rankOf(kind,id){return ranked(kind).findIndex(r=>r.it.id===id)+1;}

  return `<div class="vote">${mk('up','좋아요')}${mk('down','별로예요')}</div>`;
}

/* ---- Home ---- */
function homeRank(kind,go){
  const rows=ranked(kind).slice(0,3).map((r,i)=>{
    const fl=state.flash&&state.flash.kind===kind&&state.flash.id===r.it.id?' flash':'';
    return `<button class="rk${fl}" data-act="go" data-to="${go}" aria-label="${esc(r.it.name)} ${i+1}위">
      <span class="n">${i+1}</span><span class="nm">${esc(r.it.name)}</span>
      <span class="bar"><i style="width:${(r.ratio*100).toFixed(1)}%"></i></span>
      <span class="ct"><span class="u${r.mine==='up'?' mine':''}">${ic(PATHS.up,{s:11,c:'#3FD0C0',w:2.4})}${r.up}</span><span class="d${r.mine==='down'?' mine':''}">${ic(PATHS.down,{s:11,c:'#FF9F43',w:2.4})}${r.down}</span></span>
    </button>`;}).join('');
  return `<section class="card rank"><div class="card-h"><h3>${KIND_LABEL[kind]}</h3>
    <span class="legend"><span><i style="background:#3FD0C0"></i>좋아요</span><span><i style="background:#FF9F43"></i>별로예요</span></span></div>${rows}</section>`;

const memScroll={};
function routeKey(r){return r.name+(r.id?':'+r.id:'')+(r.type?':'+r.type:'');}
function render(opts){
  opts=opts||{};
  const r=state.route;
  const prev=$('.scroll',view);
  const keepTop=opts.keepScroll&&prev?prev.scrollTop:null;
  let html;
  switch(r.name){
    case 'home': html=renderHome();break;
    case 'course': html=renderCourse();break;
    case 'content': html=renderContent();break;
    case 'shop': html=renderShop();break;
    case 'list': html=renderList(r.type);break;
    case 'detail': html=renderDetail(r.id);break;
    case 'running': html=renderRun();break;
    default: html=renderHome();
  }
  view.innerHTML=html;
  const sc=$('.scroll',view);
  if(sc){
    if(keepTop!=null) sc.scrollTop=keepTop;
    else if(opts.restore&&memScroll[routeKey(r)]!=null) sc.scrollTop=memScroll[routeKey(r)];
  }
  state.pop=null; if(r.name==='home') state.flash=null;
  if(r.name==='running') startLoop(); else stopLoop();
}
function nav(route,opts){
  const sc=$('.scroll',view); if(sc) memScroll[routeKey(state.route)]=sc.scrollTop;
  state.route=route; render(opts);
}
function back(){
  const r=state.route;
  if(r.name==='detail'){
    const p=ALL_POSTS.find(x=>x.id===r.id);
    if(r.from==='list'&&p) return nav({name:'list',type:p.type,from:'home'},{restore:true});
    return nav({name:'home'},{restore:true});
  }
  nav({name:'home'},{restore:true});
}

function castVote(kind,id,v){
  const cur=state.votes[kind][id];
  if(cur===v) delete state.votes[kind][id]; else state.votes[kind][id]=v;
  persist();
  state.pop=cur===v?null:{kind,id,v};
  state.flash={kind,id};
  // update this page's buttons in place (no re-render => no image flicker / scroll jump)
  $$(`.vbtn[data-kind="${kind}"][data-id="${id}"]`).forEach(b=>{
    const on=state.votes[kind][id]===b.dataset.v;
    b.setAttribute('aria-pressed',on);
    b.classList.remove('pop'); void b.offsetWidth; if(on) b.classList.add('pop');
  });
  const rank=rankOf(kind,id), now=state.votes[kind][id];
  const it=DATA[kind].find(x=>x.id===id);
  const msg=now==='up'?'좋아요':now==='down'?'별로예요':'선택을 취소했어요';
  const col=now==='down'?'#FF9F43':'#3FD0C0';
  const icon=now?ic(PATHS[now],{s:15,c:col,w:2.2}):ic(PATHS.check,{s:15,c:'#9AA4A8',w:2.2});
  toast(`<b>${esc(it.name)}</b><span class="tsub">${msg}${now?'를 반영했어요':''} · 메인 ${KIND_LABEL[kind]} <b style="color:${col};white-space:nowrap">${rank}위</b></span>`,icon);
  state.pop=null;
  if(MF&&kind==='place'&&MF.sel===id){const rr=$('#mfRank');if(rr)rr.textContent=rank+'위';}
}

/* =====================================================================
   Running (simulated GPS)
   ===================================================================== */
const TOTAL=10000, SPEED=30, PM_PACE=348, CP_COUNT=14;
const PTS=ROUTE.pts; const CUM=[0];
for(let i=1;i<PTS.length;i++) CUM.push(CUM[i-1]+Math.hypot(PTS[i][0]-PTS[i-1][0],PTS[i][1]-PTS[i-1][1]));
const RLEN=CUM[CUM.length-1];
function posAt(frac){
  const d=Math.max(0,Math.min(1,frac))*RLEN;
  let lo=0,hi=CUM.length-1;
  while(hi-lo>1){const m=(lo+hi)>>1; if(CUM[m]<=d) lo=m; else hi=m;}
  const seg=CUM[hi]-CUM[lo]||1, t=(d-CUM[lo])/seg;
  return{x:PTS[lo][0]+(PTS[hi][0]-PTS[lo][0])*t,y:PTS[lo][1]+(PTS[hi][1]-PTS[lo][1])*t,i:lo};
}
function pathTo(frac){
  const p=posAt(frac); const a=PTS.slice(0,p.i+1).map(q=>q[0].toFixed(1)+','+q[1].toFixed(1));
  a.push(p.x.toFixed(1)+','+p.y.toFixed(1)); return a.join(' ');
}
function paceAt(sim){return 345+9*Math.sin(sim/95)+4*Math.sin(sim/23);}
function fmtTime(s){s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60,p=n=>String(n).padStart(2,'0');return h?`${h}:${p(m)}:${p(ss)}`:`${p(m)}:${p(ss)}`;}
function fmtPace(sec){if(!isFinite(sec)||sec<=0)return "-'--''";sec=Math.round(sec);return `${Math.floor(sec/60)}'${String(sec%60).padStart(2,'0')}''`;}

function newRun(){return{sim:0,dist:0,pm:0,paused:false,locked:false,finished:false,follow:true,mode:state.runMode,passed:0};}
function startRun(){state.run=newRun();nav({name:'running'});}

  const pm=r.mode==='hondi';
  return `<div class="runhdr">

        <img src="${IMG.map}" alt="대정읍 코스 지도" draggable="false">
        <svg viewBox="0 0 1200 566" aria-hidden="true">
          <polyline id="trav" fill="none" stroke="#2F80FF" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>
          <circle id="cpring" fill="none" stroke="#3FD0C0"><animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/></circle>
        </svg>
        ${pm?'<div class="mk pmk" id="pmDot"><div class="dotc">P</div></div>':''}
        <div class="mk me" id="meDot"><div class="gps-ring"></div><div class="dotc"></div></div>
      </div>
      <div class="rchip tl">시연 ${SPEED}배속</div>
      <button class="rchip tr" data-act="zoom" id="zoomBtn"></button>
      <div class="rchip bl"><span class="md"></span>내 위치</div>
      ${pm?'<div class="rchip br" id="pmChip"></div>':''}
    </div>
    <div class="rstats">
      <div class="bigrow"><div><div class="bignum" id="km">0.00</div><div class="unit">킬로미터</div></div>
        <div class="nextcp"><small>다음 체크포인트</small><b id="nextcp">1 / ${CP_COUNT}</b></div></div>
      <div class="prog"><i id="prog"></i></div>
      <div class="mgrid">
        <div><b id="pace">-'--''</b><small>평균 페이스</small></div>
        <div><b id="time">00:00</b><small>시간</small></div>
        <div><b id="cal">0</b><small>칼로리</small></div>
        <div><b id="gain">0 m</b><small>고도 상승</small></div>
        <div><b>${''}<span id="hr">--</span>${ic(PATHS.heart,{s:16,c:'#FF6B6B',w:2})}</b><small>평균 심박수</small></div>
        <div><b id="cad">--</b><small>케이던스</small></div>
      </div>
    </div>
    <div class="rctrl" id="rctrl"></div>`;
}
function ctrlHTML(){
  const r=state.run, L=r.locked;
  return `<button class="rb s" data-act="stopAsk" aria-label="러닝 종료" ${L?'disabled':''}><svg width="20" height="20" viewBox="0 0 24 24" fill="#EDEFEF"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
    <button class="rb m" data-act="pause" aria-label="${r.paused?'다시 시작':'일시정지'}" ${L?'disabled':''}>${r.paused
      ?'<svg width="30" height="30" viewBox="0 0 24 24" fill="#06201D"><path d="M8 5v14l11-7z"/></svg>'
      :'<svg width="30" height="30" viewBox="0 0 24 24" fill="#06201D"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>'}</button>
    <button class="rb s${L?' on':''}" data-act="lock" aria-label="${L?'잠금 해제':'잠금'}" aria-pressed="${L}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${L?'#3FD0C0':'#EDEFEF'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="${L?'M8 11V8a4 4 0 0 1 8 0v3':'M8 11V8a4 4 0 0 1 7.5-2'}"/></svg></button>
    ${r.locked?'<div class="lockhint">잠금 중 · 자물쇠를 눌러 해제</div>':''}`;
}
function paintCtrls(){
  const c=$('#rctrl'); if(c){c.style.position='relative';c.innerHTML=ctrlHTML();}
  const b=$('#rbBack'); if(b) b.disabled=!!(state.run&&state.run.locked);
  const g=$('.gps'); if(g&&state.run) g.innerHTML=`<i style="background:${state.run.paused?'#FF9F43':'#4CD964'}"></i>${state.run.paused?'일시정지됨':'GPS 연결됨'}`;
}
function paintZoomBtn(){const b=$('#zoomBtn');if(b&&state.run)b.textContent=state.run.follow?'전체 보기':'내 위치로';}
const ZOOM_FOLLOW=0.78, ZOOM_ALL=386/1200;
let lastPos={x:ROUTE.start[0],y:ROUTE.start[1]};
function applyMap(){
  const r=state.run, m=$('#rmapIn'); if(!r||!m) return;
  const W=386,H=290;
  let z,tx,ty;
  if(r.follow){
    z=ZOOM_FOLLOW; tx=W/2-lastPos.x*z; ty=H/2-lastPos.y*z;
    tx=Math.min(0,Math.max(W-1200*z,tx)); ty=Math.min(0,Math.max(H-566*z,ty));
  }else{ z=ZOOM_ALL; tx=0; ty=(H-566*z)/2; }
  m.style.transform=`translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px) scale(${z})`;
  const inv=1/z, put=(el,p)=>{if(el)el.style.transform=`translate(${p.x.toFixed(1)}px,${p.y.toFixed(1)}px) scale(${inv})`;};
  const me=$('#meDot'); put(me,lastPos);
  const tr=$('#trav'); if(tr) tr.setAttribute('stroke-width',(6*inv).toFixed(2));
  const ring=$('#cpring'); if(ring){ring.setAttribute('r',(15*inv).toFixed(1));ring.setAttribute('stroke-width',(3*inv).toFixed(2));}
  const pmd=$('#pmDot'); if(pmd&&r.pmPos) put(pmd,r.pmPos);
}
function paintRun(){
  const r=state.run; if(!r||!$('#km')) return;
  const frac=r.dist/TOTAL, km=r.dist/1000, p=posAt(frac);
  lastPos={x:p.x,y:p.y};
  $('#km').textContent=km.toFixed(2);
  $('#prog').style.width=(frac*100).toFixed(1)+'%';
  $('#pace').textContent=fmtPace(km>0.02?r.sim/km:0);
  $('#time').textContent=fmtTime(r.sim);
  $('#cal').textContent=Math.round(km*62);
  $('#gain').textContent=Math.round(frac*36)+' m';
  $('#hr').textContent=r.dist>0?Math.round(128+26*frac+3*Math.sin(r.sim/40)):'--';
  $('#cad').textContent=r.dist>0?Math.round(168+4*Math.sin(r.sim/17)):'--';
  // checkpoints
  let passed=0; while(passed<CP_COUNT&&ROUTE.cp[passed]<=frac) passed++;
  if(passed>r.passed){r.passed=passed;
    if(passed<CP_COUNT||!r.finished) toast(`체크포인트 <b>${passed}</b> 통과 · ${km.toFixed(2)} km`,ic(PATHS.check,{s:15,c:'#3FD0C0',w:2.4}));}
  const nx=$('#nextcp'); nx.textContent=passed>=CP_COUNT?'도착':`${passed+1} / ${CP_COUNT}`;
  const ring=$('#cpring');
  if(ring){ if(passed<CP_COUNT){const c=ROUTE.cpxy[passed];ring.setAttribute('cx',c[0]);ring.setAttribute('cy',c[1]);ring.style.display='';}
           else{ring.style.display='none';} }
  $('#trav').setAttribute('points',pathTo(frac));
  if(r.mode==='hondi'){
    const pf=Math.min(1,r.pm/TOTAL); r.pmPos=posAt(pf);
    const gap=Math.round(r.dist-r.pm), chip=$('#pmChip');
    if(chip) chip.textContent=`페이스메이커 ${gap>=0?'+':'−'}${Math.abs(gap)} m ${gap>=0?'앞서는 중':'뒤처지는 중'}`;
  }
  applyMap();
}
let raf=0,lastT=0;
function loop(t){
  const r=state.run;
  if(!r||state.route.name!=='running'){raf=0;return;}
  const dt=Math.min(0.1,(t-lastT)/1000||0); lastT=t;
  if(!r.paused&&!r.finished&&!state.sheet){
    const sd=dt*SPEED, pace=paceAt(r.sim);
    r.sim+=sd; r.dist+=1000/pace*sd; r.pm+=1000/PM_PACE*sd;
    if(r.dist>=TOTAL){r.dist=TOTAL;r.finished=true;paintRun();setSheet({type:'finish'});raf=requestAnimationFrame(loop);return;}
  }
  paintRun();
  raf=requestAnimationFrame(loop);
}
function startLoop(){
  lastPos={x:ROUTE.start[0],y:ROUTE.start[1]};
  paintCtrls();paintZoomBtn();
  cancelAnimationFrame(raf);lastT=performance.now();paintRun();raf=requestAnimationFrame(loop);
}
function stopLoop(){cancelAnimationFrame(raf);raf=0;}


/* =====================================================================
   Expanded course map (fixed image, place pins, category dropdown)
   ===================================================================== */
let MF=null;
const CAT_LABEL={all:'전체',sight:'관광지',food:'맛집·카페',facility:'편의시설'};
const CAT_COLOR={all:'#EDEFEF',sight:'#7FE3D8',food:'#FFB86B',facility:'#9DB9FF'};
const MF_DUR=520, ZOOM_PIN=1.25;
function phoneBox(){const ph=$('#phone');return{ph,W:ph.offsetWidth,H:ph.offsetHeight};}
function cardRect(){
  const {ph,W,H}=phoneBox(), pr=ph.getBoundingClientRect(), k=pr.width/W||1, im=$('.mapimg');
  if(!im) return{l:20,t:300,w:W-40,h:(W-40)*163/346,W,H};
  const r=im.getBoundingClientRect();
  return{l:(r.left-pr.left)/k,t:(r.top-pr.top)/k,w:r.width/k,h:r.height/k,W,H};
}
function clipFor(c){return `inset(${c.t}px ${c.W-c.l-c.w}px ${c.H-c.t-c.h}px ${c.l}px round 16px)`;}
function overviewView(){const {W,H}=phoneBox();const z=Math.max(.42,Math.min(.9,(W-24)/720));return{z,x:W/2-600*z,y:(H-566*z)/2-30};}
function focusView(x,y,cardTotal){
  const {W,H}=phoneBox(), free=H-(cardTotal||0), z=Math.max(ZOOM_PIN,free/566+.02);
  const cx=W/2, cy=cardTotal?free/2+26:H/2;
  let tx=cx-x*z, ty=cy-y*z;
  tx=Math.max(W-1200*z,Math.min(0,tx));
  ty=Math.max(Math.min(0,free-566*z),Math.min(0,ty));
  return{z,x:tx,y:ty};
}
function mfSetView(v){
  MF.view=v; MF.el.classList.toggle('zoomed',v.z>ZOOM_PIN-.01); MF.stage.style.transform=`translate(${v.x.toFixed(1)}px,${v.y.toFixed(1)}px) scale(${v.z})`;
  const inv=1/v.z;
  $$('.mpin',MF.el).forEach(m=>{m.style.transform=`translate(${m.dataset.x}px,${m.dataset.y}px) scale(${inv})`;});
}
function pinsHTML(){
  return [...PLACES].sort((a,b)=>a.pos[1]-b.pos[1]).map(p=>
    `<div class="mpin" data-id="${p.id}" data-x="${p.pos[0]}" data-y="${p.pos[1]}" style="--c:${CAT_COLOR[p.cat]}">
      <button class="mpb" data-act="pin" data-id="${p.id}" aria-label="${esc(p.name)} 자세히 보기"><span class="mpl">${esc(p.name)}</span>
      <span class="mpi"><img src="${artUri(p.id)}" alt="" draggable="false"></span><span class="mpt"></span></button></div>`).join('')+
    `<div class="mpin me" id="mpMe" data-x="${ROUTE.start[0]}" data-y="${ROUTE.start[1]}" style="opacity:0"><div class="gps-ring"></div><div class="dotc"></div></div>`;
}
function catCount(f){return f==='all'?PLACES.length:PLACES.filter(p=>p.cat===f).length;}
function ddHTML(){
  const f=MF.filter;
  const items=['all','sight','food','facility'].map(k=>`<li><button role="option" aria-selected="${k===f}" data-act="ddPick" data-f="${k}"><span class="dot" style="background:${CAT_COLOR[k]}"></span>${CAT_LABEL[k]}<span class="n">${catCount(k)}</span></button></li>`).join('');
  return `<div class="dd"><button class="ddb" data-act="ddToggle" aria-haspopup="listbox" aria-expanded="${MF.ddOpen}" aria-label="장소 분류 선택">
    <span class="dot" style="background:${CAT_COLOR[f]}"></span><b>${CAT_LABEL[f]}</b><span class="n">${catCount(f)}</span>${ic(PATHS.drop,{s:16,c:'#C9CFD2',w:2})}</button>
    ${MF.ddOpen?`<ul class="ddm" role="listbox">${items}</ul>`:''}</div>`;
}
function paintDD(){const d=$('.dd',MF.el);if(d)d.outerHTML=ddHTML();}
function applyFilter(){
  const f=MF.filter;
  $$('.mpin[data-id]',MF.el).forEach(m=>{const p=PLACES.find(x=>x.id===m.dataset.id);m.classList.toggle('hide',!(f==='all'||p.cat===f));});
}
function pickFilter(f){
  MF.filter=f; MF.ddOpen=false; paintDD(); applyFilter();
  if(MF.sel){const p=PLACES.find(x=>x.id===MF.sel); if(!(f==='all'||p.cat===f)) mfOverview();}
}
function cardHTML(p){
  const c=CATS[p.cat];
  return `<button class="mfc-x" data-act="mapbg" aria-label="닫기">${ic('M6 6l12 12M18 6L6 18',{s:16,c:'#fff',w:2.2})}</button>
  <div class="mfc-top"><div class="mfc-img"><img src="${artUri(p.id)}" alt="${esc(p.name)} 대표 이미지"><span class="mfc-cap">일러스트</span></div>
    <div class="mfc-info"><div class="mfc-t"><span class="cchip" style="color:${c.color};background:${c.color}22">${c.chip}</span><span class="rkchip">인기 명소 <b id="mfRank">${rankOf('place',p.id)}위</b></span></div>
    <h3>${esc(p.name)}</h3><p class="mfc-tags">${p.tags.map(t=>'# '+esc(t)).join(' ')}</p></div></div>
  <div class="mfc-b"><p class="mfc-desc">${esc(p.desc)}</p>
    <div class="mfc-row">${voteBtns('place',p.id,'lg')}<button class="cta sm" data-act="map" data-id="${p.id}">지도 앱에서 보기</button></div></div>`;
}
function setCardH(h){MF.el.style.setProperty('--cardh',h+'px');}
function openMap(){
  if(MF) return;
  const c=cardRect(), el=document.createElement('div');
  el.className='mapfull'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true'); el.setAttribute('aria-label','코스 주변 지도');
  el.innerHTML=`<div class="mf-bg" data-act="mapbg" style="background-image:url(${IMG.map})"></div>
    <div class="mf-stage" data-act="mapbg"><img src="${IMG.map}" alt="대정읍 러닝 코스 지도" draggable="false">${pinsHTML()}</div>
    <div class="mf-ui mf-top">${'<div class="dd"></div>'}<button class="mfbtn" data-act="mapClose" aria-label="지도 축소">${ic('M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5',{s:20,c:'#fff',w:2})}</button></div>
    <button class="mfbtn find mf-ui" data-act="find" aria-label="내 위치 찾기">${'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg>'}</button>
    <div class="mf-hint mf-ui">핀을 누르면 장소 정보를 볼 수 있어요</div>
    <div class="mf-card" id="mfCard"></div>`;
  MF={el,stage:$('.mf-stage',el),filter:'all',sel:null,me:false,zoomed:false,ddOpen:false,busy:true,view:null};
  el.style.clipPath=clipFor(c);
  MF.stage.style.transition='none';
  MF.stage.style.transform=`translate(${c.l}px,${c.t}px) scale(${c.w/1200})`;
  $('#phone').appendChild(el);
  paintDD();
  const ov=overviewView(); $$('.mpin',el).forEach(m=>{m.style.transform=`translate(${m.dataset.x}px,${m.dataset.y}px) scale(${1/ov.z})`;});
  void el.offsetWidth;
  MF.stage.style.transition='';
  requestAnimationFrame(()=>{
    el.classList.add('open'); el.style.clipPath='inset(0px 0px 0px 0px round 0px)'; mfSetView(ov);
    setTimeout(()=>{if(MF&&MF.el===el){el.classList.add('ready');MF.busy=false;}},MF_DUR-60);
  });
}
function closeMap(){
  if(!MF||MF.busy) return;
  MF.busy=true; const m=MF, el=m.el;
  el.classList.remove('ready'); el.classList.remove('open'); el.classList.add('closing');
  m.ddOpen=false; paintDD(); $('#mfCard').classList.remove('show'); setCardH(0);
  const c=cardRect();
  el.style.clipPath=clipFor(c);
  m.stage.style.transform=`translate(${c.l}px,${c.t}px) scale(${c.w/1200})`;
  setTimeout(()=>{el.remove();if(MF===m)MF=null;},MF_DUR+40);
}
function selectPlace(id){
  if(!MF||MF.busy) return;
  const p=PLACES.find(x=>x.id===id); if(!p) return;
  MF.sel=id; MF.ddOpen=false; paintDD();
  $$('.mpin[data-id]',MF.el).forEach(m=>m.classList.toggle('sel',m.dataset.id===id));
  const card=$('#mfCard'); card.innerHTML=cardHTML(p); card.classList.add('show');
  const {H}=phoneBox(); const cardH=card.offsetHeight+26;
  setCardH(card.offsetHeight);
  MF.zoomed=true; mfSetView(focusView(p.pos[0],p.pos[1],Math.min(cardH,H*.62)));
}
function mfOverview(){
  if(!MF) return;
  MF.sel=null; MF.zoomed=false; $$('.mpin.sel',MF.el).forEach(m=>m.classList.remove('sel'));
  $('#mfCard').classList.remove('show'); setCardH(0); mfSetView(overviewView());
}
function mapBg(esc){
  if(!MF||MF.busy) return;
  if(MF.ddOpen){MF.ddOpen=false;paintDD();return;}
  if(MF.sel||MF.zoomed){mfOverview();return;}
  if(esc) closeMap();
}
function mfFind(){
  if(!MF||MF.busy) return;
  const me=$('#mpMe',MF.el), first=!MF.me;
  MF.me=true; MF.ddOpen=false; paintDD();
  me.style.opacity=1; me.classList.add('show');
  $('.find',MF.el).classList.add('on');
  MF.sel=null; $$('.mpin.sel',MF.el).forEach(m=>m.classList.remove('sel'));
  $('#mfCard').classList.remove('show'); setCardH(0);
  MF.zoomed=true; mfSetView(focusView(ROUTE.start[0],ROUTE.start[1],0));
  if(first) toast('내 위치를 표시했어요 · 시연용으로 <b>출발 지점</b> 근처예요',ic(PATHS.pin,{s:15,c:'#2F80FF',w:2.2}));
}

/* =====================================================================
   Chrome: clock + responsive scale of the phone frame
   ===================================================================== */
function tick(){const d=new Date();const h=d.getHours()%12||12;const c=$('#clock');if(c)c.textContent=h+':'+String(d.getMinutes()).padStart(2,'0');}
tick();setInterval(tick,20000);
function fit(){
  const dev=$('#device'); if(!dev) return;
  if(innerWidth<=520){dev.style.removeProperty('--s');return;}
  const s=Math.min(1,(innerHeight-24)/866,(innerWidth-24)/414);
  dev.style.setProperty('--s',Math.max(.4,s).toFixed(3));
}
addEventListener('resize',fit);fit();

render();
})();

</script>
</body>
